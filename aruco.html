<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detector ArUco</title>
    <style>
      body { margin: 0; background-color: #262626; color: white; font-family: sans-serif; text-align: center; }
      #header { height: 100px; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #1a1a1a; }
      h2 { margin: 0; font-size: 1.2rem; color: #aaa; }
      #last-id { font-size: 2.5rem; font-weight: bold; color: #00ff00; margin-top: 5px; }
    </style>
  </head>
  <body>
    <script src="https://app.protobject.com/framework/p.js"></script>
    <script src="./config.js"></script>

    <div id="header">
      <h2>Último ID Detectado</h2>
      <div id="last-id">-</div>
    </div>

    <script>
      const camWidth = Math.min(window.innerWidth - 40, 400); 
      const camHeight = camWidth * 0.75; 
      const camLeft = (window.innerWidth - camWidth) / 2;

      Protobject.Aruco.start(200, 0);
      Protobject.Aruco.showPreview({ top: 130, left: camLeft, width: camWidth, height: camHeight });

      Protobject.Aruco.onData(function (data) {
        const markerIds = Object.keys(data);
        if (markerIds.length > 0) {
          const detectedId = markerIds[0];
          
          document.getElementById('last-id').innerText = detectedId;
          
          Protobject.Core.send(detectedId).to("index.html");
        }
      });
    </script>
  </body>
</html>
